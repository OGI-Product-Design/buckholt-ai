<!doctype html>
<html lang="en-GB" data-bs-theme="buckholt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobius — navigation prototype</title>

<!-- Buckholt runtime contract. Order is fixed; no separate Bootstrap stylesheet. -->
<link rel="stylesheet" href="https://use.typekit.net/vtl2xbn.css">
<script src="https://kit.fontawesome.com/ca92816a31.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../css/buckholt.css">
<link rel="stylesheet" href="../css/buckholt-ai-fixes.css">
<!-- Prototype-only. Shared application chrome and blade, then this feature. -->
<link rel="stylesheet" href="../prototype/app-shell.css">
<link rel="stylesheet" href="../prototype/blade.css">
<link rel="stylesheet" href="mobius-navigation.css">
</head>
<body>

<a class="visually-hidden-focusable mob-skip" href="#mob-title" data-skip>Skip to content</a>

<div class="layout" data-layout="layout-03" data-layout-surface="flush">

  <!-- ======================================================================
       STATIC APPLICATION CHROME — the shared Mobius top bar
       (`prototype/app-shell.css`). Its contents are Buckholt components:
       the Menu button (narrow screens), the
       system modules as Page navigation with icons, the "Show wording
       changes" review aid
       (Switch), and the user menu under the avatar (Menu button + Avatar).
       ====================================================================== -->
  <header class="app-bar">
    <div class="button-set mob-menu-button-set">
      <button type="button" class="btn btn-ghost" id="mob-menu-open" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"
        data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Open menu">
        <div class="btn-icon"><i class="fa-regular fa-bars" aria-hidden="true"></i></div>
      </button>
    </div>

    <a class="app-bar-logo" href="#dashboard">Mobius</a>

    <!-- System modules: Page navigation, the icon straight inside each link.
         Written by mobius-navigation.js so the current module is marked. -->
    <nav class="mob-modules" aria-label="Modules" id="mob-modules"></nav>

    <div class="app-bar-right">
      <!-- Dev / review aid: highlights wording that differs from current
           Mobius. Buckholt Switch, small. -->
      <div class="form-check form-switch form-switch-sm mob-terms">
        <input class="form-check-input" type="checkbox" role="switch" id="mob-terms-toggle" checked>
        <div class="input-label">
          <label class="form-check-label" for="mob-terms-toggle">Show wording changes</label>
        </div>
      </div>

      <span class="app-bar-status">Test</span>

      <!-- Live clock, set and ticked by Shell.startClock(). -->
      <div class="app-bar-clock">
        <time class="app-bar-time" id="app-clock-time" datetime="15:26">15:26</time>
        <time class="app-bar-date" id="app-clock-date" datetime="2026-10-01">01 October 2026</time>
      </div>

      <!-- User menu: Buckholt Menu button (Code & specs example 1) whose
           trigger is the user's Avatar. Bootstrap Dropdown gives the
           keyboard behaviour. Items are written by mobius-navigation.js. -->
      <div class="menu mob-user-menu">
        <button type="button" class="menu-toggle mob-avatar-toggle" id="mob-user-toggle" data-bs-toggle="dropdown" aria-expanded="false"
          aria-label="User menu, Laurence Abbott">
          <div class="avatar avatar-sm" aria-hidden="true"><div class="avatar-initials">LA</div></div>
        </button>
        <div class="menu-panel dropdown-menu dropdown-menu-end" aria-labelledby="mob-user-toggle">
          <ul class="menu-body" role="menu" id="mob-user-items"></ul>
        </div>
      </div>
    </div>
  </header>

  <!-- ======================================================================
       THE MENU — Buckholt from here down. Two columns at client and policy
       level, as in the new designs: the blue rail (the client and their
       policies) and the record column (that record's pages and actions).
       The rail is on every page, with the search at its top; the record
       column and toolbar only on client and policy pages. Below 1280px it
       is a drawer, which also takes the modules from the top bar.
       ====================================================================== -->
  <aside id="sidebar" class="mob-sidebar" aria-label="Menu">
    <div class="mob-drawer-head">
      <div class="button-set">
        <button type="button" class="btn btn-ghost" id="mob-menu-close" data-close-menu aria-label="Close menu"
          data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Close menu">
          <div class="btn-icon"><i class="fa-regular fa-xmark" aria-hidden="true"></i></div>
        </button>
      </div>
    </div>
    <!-- On narrow screens the modules move in here. -->
    <nav class="mob-drawer-modules" aria-label="Modules" id="mob-drawer-modules"></nav>

    <div class="mob-columns">
      <!-- The rail: Buckholt dark theme. Its search is static; the rest is
           written by mobius-navigation.js. -->
      <div class="mob-rail" id="mob-rail" data-bs-theme="dark">
        <div class="mob-rail-head" id="mob-rail-head"></div>
        <!-- Search: Buckholt Text input with its search icon. Running a
             search opens the results. -->
        <form class="mob-search" role="search" id="mob-search" autocomplete="off">
          <div class="input">
            <div class="input-label">
              <label for="mob-search-input" class="form-label visually-hidden">Search</label>
            </div>
            <div class="response text-input">
              <i class="input-icon fa-regular fa-magnifying-glass" aria-hidden="true"></i>
              <input type="search" class="form-control" id="mob-search-input" placeholder="Name, reference or email">
            </div>
          </div>
        </form>
        <div class="mob-rail-scroll" id="mob-rail-body"></div>
        <div class="mob-rail-foot" id="mob-rail-foot"></div>
      </div>
      <div class="mob-record" id="mob-record"></div>
      <div class="mob-toolbar" id="mob-toolbar" hidden></div>
    </div>
  </aside>

  <!-- ======================================================================
       MAIN — Page body → Frame → Pane → Panels, per patterns/page-layout.
       Breadcrumbs at the top of the first Panel say where the page is.
       ====================================================================== -->
  <main id="main">
    <div class="page-body">
      <div class="page-frame">
        <div class="container-fluid">
          <div class="page-pane" id="mob-page"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="mob-scrim" id="mob-scrim" hidden></div>

<!-- ==========================================================================
     Confirmation — Buckholt Modal (Code & specs example 1). Title, body and
     the confirm label are set per action. The confirm Button is the danger
     variant for destructive actions only.
     ========================================================================== -->
<div class="modal fade" id="mob-confirm" tabindex="-1" aria-labelledby="mob-confirm-title" aria-describedby="mob-confirm-text">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <div class="text-block">
          <div class="heading">
            <div class="heading-content">
              <h2 class="headline-02" id="mob-confirm-title"></h2>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
        </div>
      </div>
      <div class="modal-body">
        <div class="text-block">
          <p id="mob-confirm-text"></p>
        </div>
      </div>
      <div class="modal-footer">
        <div class="button-set">
          <button type="button" class="btn btn-ghost" id="mob-confirm-cancel" data-bs-dismiss="modal"><span class="button-label">Cancel</span></button>
          <button type="button" class="btn btn-primary" id="mob-confirm-ok"><span class="button-label">Confirm</span></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast stack, bottom right (prototype/app-shell.css). -->
<div class="toast-container app-toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../prototype/app-shell.js"></script>
<script src="../prototype/blade.js"></script>
<script src="fixtures.js"></script>
<script src="navigation-model.js"></script>
<script src="pages.js"></script>
<script src="mobius-navigation.js"></script>
</body>
</html>
