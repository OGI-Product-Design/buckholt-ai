<!doctype html>
<html lang="en-GB" data-bs-theme="buckholt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobius — navigation prototype</title>

<!-- Buckholt runtime contract. Order is fixed; no separate Bootstrap stylesheet. -->
<link rel="stylesheet" href="https://use.typekit.net/vtl2xbn.css">
<script src="https://kit.fontawesome.com/ca92816a31.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../css/buckholt.css">
<link rel="stylesheet" href="../css/buckholt-ai-fixes.css">
<!-- Prototype-only. Shared application chrome and blade, then this feature. -->
<link rel="stylesheet" href="../prototype/app-shell.css">
<link rel="stylesheet" href="../prototype/blade.css">
<!-- ?v= is bumped with every change, so browsers fetch this prototype's
     own files afresh rather than an old cached copy. -->
<link rel="stylesheet" href="mobius-navigation.css?v=20261008-2">
</head>
<body class="mob-hide-terms">

<a class="visually-hidden-focusable mob-skip" href="#mob-title" data-skip>Skip to content</a>

<div class="layout" data-layout="layout-03" data-layout-surface="flush">

  <!-- ======================================================================
       STATIC APPLICATION CHROME — the shared Mobius top bar
       (`prototype/app-shell.css`). Its contents are Buckholt components:
       the Menu button (narrow screens), the search field (a Text input that
       opens the search Modal), the "Show wording changes" review aid
       (Switch), the system menu (an icon-only Menu button whose panel holds
       the systems as large Response buttons) and the user menu under the
       avatar (Menu button + Avatar).
       ====================================================================== -->
  <header class="app-bar">
    <div class="button-set mob-menu-button-set">
      <button type="button" class="btn btn-ghost" id="mob-menu-open" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"
        data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Open menu">
        <div class="btn-icon"><i class="fa-regular fa-bars" aria-hidden="true"></i></div>
      </button>
    </div>

    <a class="app-bar-logo" href="#dashboard">Mobius</a>

    <!-- Search: Buckholt Text input with its search icon, next to the
         wordmark. It does not search by itself: a click, Enter, Down arrow
         or the first character typed opens the search Modal, carrying the
         character over. "/" opens it from anywhere, and the field says so. -->
    <form class="mob-app-search" role="search" id="mob-search" autocomplete="off">
      <div class="input">
        <div class="input-label">
          <label for="mob-search-input" class="form-label visually-hidden">Search clients and policies</label>
        </div>
        <div class="response text-input">
          <i class="input-icon fa-regular fa-magnifying-glass" aria-hidden="true"></i>
          <input type="text" class="form-control" id="mob-search-input" enterkeyhint="search"
            aria-haspopup="dialog" aria-controls="mob-search-modal" aria-keyshortcuts="/">
          <!-- The hint in place of a placeholder: "Type / to search". -->
          <span class="mob-search-hint" aria-hidden="true"><span class="mob-search-hint-long">Type <kbd>/</kbd> to search</span><span class="mob-search-hint-short">Search</span></span>
        </div>
      </div>
    </form>

    <div class="app-bar-right">
      <!-- Dev / review aid: highlights wording that differs from current
           Mobius. Buckholt Switch, small. -->
      <div class="form-check form-switch form-switch-sm mob-terms">
        <input class="form-check-input" type="checkbox" role="switch" id="mob-terms-toggle">
        <div class="input-label">
          <label class="form-check-label" for="mob-terms-toggle">Show wording changes</label>
        </div>
      </div>

      <span class="app-bar-status">Test</span>

      <!-- Live clock, set and ticked by Shell.startClock(). -->
      <div class="app-bar-clock">
        <time class="app-bar-time" id="app-clock-time" datetime="15:26">15:26</time>
        <time class="app-bar-date" id="app-clock-date" datetime="2026-10-01">01 October 2026</time>
      </div>

      <!-- System menu: Buckholt Menu button with an icon-only ghost trigger
           (as the Overflow menu, Code & specs example 3) and its Tooltip on
           the wrapper. Its panel holds the systems (Broking, Activity,
           Renewals, Bordereau, Accounts) as large Response buttons with
           icons (Response button Code & specs example 8): one Radio group,
           the current system checked. Written by mobius-navigation.js. -->
      <div class="menu mob-systems" data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Switch system">
        <button type="button" class="btn btn-ghost menu-toggle" id="mob-systems-toggle" data-bs-toggle="dropdown" aria-expanded="false"
          aria-label="Switch system" aria-controls="mob-systems-panel">
          <div class="btn-icon"><i class="fa-regular fa-grid" aria-hidden="true"></i></div>
        </button>
        <div class="menu-panel dropdown-menu dropdown-menu-end" id="mob-systems-panel"></div>
      </div>

      <!-- User menu: Buckholt Menu button (Code & specs example 1) whose
           trigger is the user's Avatar. Bootstrap Dropdown gives the
           keyboard behaviour. Items are written by mobius-navigation.js. -->
      <div class="menu mob-user-menu">
        <button type="button" class="menu-toggle mob-avatar-toggle" id="mob-user-toggle" data-bs-toggle="dropdown" aria-expanded="false"
          aria-label="User menu, Laurence Abbott">
          <div class="avatar avatar-sm" aria-hidden="true"><div class="avatar-initials">LA</div></div>
        </button>
        <div class="menu-panel dropdown-menu dropdown-menu-end" aria-labelledby="mob-user-toggle">
          <ul class="menu-body" role="menu" id="mob-user-items"></ul>
        </div>
      </div>
    </div>
  </header>

  <!-- ======================================================================
       THE MENU — Buckholt from here down. Two columns at client and policy
       level: the rail (the client, their pages and their policies) and,
       once a policy is open, the policy column (its actions and pages).
       Nothing at app level. Below 1024px it is a drawer.
       ====================================================================== -->
  <aside id="sidebar" class="mob-sidebar mob-no-anim" aria-label="Menu">
    <div class="mob-drawer-head">
      <div class="button-set">
        <button type="button" class="btn btn-ghost" id="mob-menu-close" data-close-menu aria-label="Close menu"
          data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-title="Close menu">
          <div class="btn-icon"><i class="fa-regular fa-xmark" aria-hidden="true"></i></div>
        </button>
      </div>
    </div>
    <div class="mob-columns">
      <!-- The rail: the selected client's menu, written by
           mobius-navigation.js. -->
      <div class="mob-rail" id="mob-rail">
        <div class="mob-rail-head" id="mob-rail-head"></div>
        <div class="mob-rail-scroll" id="mob-rail-body"></div>
        <div class="mob-rail-foot" id="mob-rail-foot"></div>
      </div>
      <div class="mob-record" id="mob-record"></div>
    </div>
  </aside>

  <!-- ======================================================================
       MAIN — Page body → Frame → Pane → Panels, per patterns/page-layout.
       Breadcrumbs at the top of the first Panel say where the page is.
       ====================================================================== -->
  <main id="main">
    <div class="page-body">
      <div class="page-frame">
        <div class="container-fluid">
          <div class="page-pane" id="mob-page"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="mob-scrim" id="mob-scrim" hidden></div>

<!-- ==========================================================================
     Confirmation — Buckholt Modal (Code & specs example 1). Title, body and
     the confirm label are set per action. The confirm Button is the danger
     variant for destructive actions only.
     ========================================================================== -->
<div class="modal fade" id="mob-confirm" tabindex="-1" aria-labelledby="mob-confirm-title" aria-describedby="mob-confirm-text">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <div class="text-block">
          <div class="heading">
            <div class="heading-content">
              <h2 class="headline-02" id="mob-confirm-title"></h2>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
        </div>
      </div>
      <div class="modal-body">
        <div class="text-block">
          <p id="mob-confirm-text"></p>
        </div>
      </div>
      <div class="modal-footer">
        <div class="button-set">
          <button type="button" class="btn btn-ghost" id="mob-confirm-cancel" data-bs-dismiss="modal"><span class="button-label">Cancel</span></button>
          <button type="button" class="btn btn-primary" id="mob-confirm-ok"><span class="button-label">Confirm</span></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ==========================================================================
     Search — Buckholt Modal (Code & specs example 1), extra large and
     scrollable, so the page you are on stays behind it (Jon's suggestion).
     The search field, recent searches and the results are written by
     mobius-navigation.js.
     ========================================================================== -->
<div class="modal fade" id="mob-search-modal" tabindex="-1" aria-labelledby="mob-search-title">
  <div class="modal-dialog modal-dialog-scrollable modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <div class="text-block">
          <div class="heading">
            <div class="heading-content">
              <h2 class="headline-02" id="mob-search-title">Search</h2>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
        </div>
      </div>
      <div class="modal-body">
        <div class="mob-search-modal-bar">
          <form class="mob-search-modal-form" role="search" id="mob-search-modal-form" autocomplete="off">
            <div class="input">
              <div class="input-label">
                <label for="mob-search-modal-input" class="form-label visually-hidden">Search by name, reference or email</label>
              </div>
              <div class="response text-input">
                <i class="input-icon fa-regular fa-magnifying-glass" aria-hidden="true"></i>
                <input type="text" class="form-control" id="mob-search-modal-input" placeholder="Search by name, reference or email"
                  enterkeyhint="search" aria-describedby="mob-search-modal-hint">
                <!-- Buckholt's clear button (Text input Code & specs example 6),
                     driven by components/form/form.js. -->
                <button type="button" class="input-btn input-clear" aria-label="Clear"></button>
              </div>
            </div>
            <p class="visually-hidden" id="mob-search-modal-hint">Press the down arrow for recent searches.</p>
          </form>
          <!-- "What can I search?": a ghost Button that opens a floating help
               panel to its right, as current Mobius has it. Buckholt has no
               Popover, so the panel is a Menu panel (`.menu-panel.dropdown-menu`)
               on Bootstrap Dropdown, holding a Text block, Lists and a Link. -->
          <div class="menu mob-search-help">
            <button type="button" class="btn btn-ghost menu-toggle" id="mob-search-help-toggle" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" aria-controls="mob-search-help">
              <div class="btn-icon"><i class="fa-regular fa-circle-info" aria-hidden="true"></i></div>
              <span class="button-label">What can I search?</span>
            </button>
            <div class="menu-panel dropdown-menu dropdown-menu-end" id="mob-search-help" role="dialog" aria-labelledby="mob-search-help-title"></div>
          </div>
        </div>
        <div id="mob-search-modal-body" aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>

<!-- Toast stack, bottom right (prototype/app-shell.css). -->
<div class="toast-container app-toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Buckholt's shared Form behaviour (the search field's clear button)
     needs jQuery, loaded first, as CLAUDE.md sets out. -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../components/form/form.js"></script>
<script src="../prototype/app-shell.js"></script>
<script src="../prototype/blade.js"></script>
<script src="fixtures.js?v=20261008-2"></script>
<script src="navigation-model.js?v=20261008-2"></script>
<script src="pages.js?v=20261008-2"></script>
<script src="mobius-navigation.js?v=20261008-2"></script>
</body>
</html>
