<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F5;--surface:#FFFFFF;--side:#FFFFFF;--line:#E3E3DE;--line2:#EEEEEA;--thead:#F4F4F1;
  --text:#14161A;--text2:#2E3138;--muted:#5C6068;--hover:#F0F0EC;
  --brand:#2A4FAE;--brand-ink:#1E3C8C;--brand-soft:#E8EDF8;--context:#22408F;--context-text:#FFFFFF;
  --active-bg:#14161A;--active-text:#FFFFFF;
  --ok-bg:#DDF0E1;--ok-text:#1D5B2C;--warn-bg:#FBEBCB;--warn-text:#7A4B00;--bad-bg:#F8E1DE;--bad-text:#8E1E14;--neu-bg:#E9E9E5;--neu-text:#3A3D44;
  --danger:#A61B1B;--danger-bg:#F8E6E4;
  --scrim:rgba(20,22,26,.45);--shadow:0 16px 40px rgba(20,22,26,.14);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111215;--surface:#191A1E;--side:#15161A;--line:#2A2C31;--line2:#232529;--thead:#1F2025;
  --text:#F1F1EE;--text2:#D5D5D0;--muted:#A1A5AC;--hover:#222429;
  --brand:#8FA9EE;--brand-ink:#B3C5F5;--brand-soft:#1E2846;--context:#1A2850;--context-text:#F1F1EE;
  --active-bg:#F1F1EE;--active-text:#111215;
  --ok-bg:#1C3524;--ok-text:#9ED8AC;--warn-bg:#3A2D12;--warn-text:#F2C878;--bad-bg:#3A1F1D;--bad-text:#F5A49A;--neu-bg:#2A2C31;--neu-text:#D5D5D0;
  --danger:#F08A80;--danger-bg:#3A1F1D;--scrim:rgba(0,0,0,.6);--shadow:0 16px 40px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#111215;--surface:#191A1E;--side:#15161A;--line:#2A2C31;--line2:#232529;--thead:#1F2025;
  --text:#F1F1EE;--text2:#D5D5D0;--muted:#A1A5AC;--hover:#222429;
  --brand:#8FA9EE;--brand-ink:#B3C5F5;--brand-soft:#1E2846;--context:#1A2850;--context-text:#F1F1EE;
  --active-bg:#F1F1EE;--active-text:#111215;
  --ok-bg:#1C3524;--ok-text:#9ED8AC;--warn-bg:#3A2D12;--warn-text:#F2C878;--bad-bg:#3A1F1D;--bad-text:#F5A49A;--neu-bg:#2A2C31;--neu-text:#D5D5D0;
  --danger:#F08A80;--danger-bg:#3A1F1D;--scrim:rgba(0,0,0,.6);--shadow:0 16px 40px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans','Helvetica Neue',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-ink)}
svg{flex:none}
.mono{font-family:'IBM Plex Mono',monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.shell{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.wordmark{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--text);text-decoration:none}
.search{flex:1 1 auto;max-width:420px;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted)}
.search input{border:0;background:transparent;outline:0;width:100%;font-size:16px;color:var(--text)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.env{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.clock{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.clock b{display:block;font-size:14px;color:var(--text);font-weight:600}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand-ink);font-weight:600;font-size:13px}
.icon-btn.menu-toggle{display:none}
.context{display:flex;align-items:center;flex-wrap:wrap;gap:6px 20px;padding:10px 20px;background:var(--context);color:var(--context-text);font-size:13px}
.context:empty{display:none}
.context .who{font-weight:600}
.context .kv span:first-child{opacity:.75;margin-right:6px}
.pill{display:inline-flex;align-items:center;min-height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok-text)}.t-warn{background:var(--warn-bg);color:var(--warn-text)}.t-bad{background:var(--bad-bg);color:var(--bad-text)}.t-neu{background:var(--neu-bg);color:var(--neu-text)}
.body{flex:1 1 auto;display:flex;min-height:0}

.side{width:296px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-scroll{position:relative;flex:1 1 auto;overflow-y:auto;padding:14px 12px 20px;display:flex;flex-direction:column;gap:18px}
.sec-label{padding:0 12px;margin-bottom:6px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--text2);text-decoration:none;text-align:left;font-size:14px;cursor:pointer}
.item:hover{background:var(--hover);color:var(--text)}
.item .lbl{flex:1 1 auto;min-width:0}
.item[aria-current="page"]{background:var(--active-bg);color:var(--active-text);font-weight:600}
.item[aria-current="page"] .pill{background:transparent;color:inherit;border:1px solid currentColor;opacity:.85}
.group-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.group-btn.has-current{color:var(--text);font-weight:600}
.chev{transition:transform .15s ease;color:var(--muted);display:flex}
.sub{list-style:none;margin:2px 0 6px;padding:0 0 0 30px;display:none;flex-direction:column;gap:2px}
.group-btn[aria-expanded="true"] + .sub{display:flex}
.sub .item{min-height:36px;font-size:13.5px}
.rule{height:1px;background:var(--line);margin:0 12px}
.act .ico{color:var(--brand);display:flex}
.act[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.act .tail{color:var(--muted);display:flex}
.act.danger,.act.danger .ico{color:var(--danger)}
.act.danger:hover{background:var(--danger-bg)}
.act-sub{padding:8px 12px 2px;font-size:12px;color:var(--muted)}
.side-foot{border-top:1px solid var(--line);padding:10px 12px}
.back-link{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:13px}
.back-link:hover{background:var(--hover);color:var(--text)}
.ctx-card{margin:0 4px;padding:12px;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.ctx-card .k{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ctx-card .t{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.ctx-card .s{font-size:12.5px;color:var(--muted)}
.ctx-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.switch-btn{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 0 0;color:var(--brand-ink);font-size:13px;font-weight:500;cursor:pointer}
.switch-btn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.pol-list{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.pol-item{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:8px 12px;min-height:44px}
.pol-item .r1{display:flex;align-items:center;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.pol-item .r2{font-size:12px;color:var(--muted)}
.item[aria-current="page"] .r2{color:inherit;opacity:.75}
.more-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:38px;margin-top:4px;border:1px dashed var(--line);border-radius:8px;background:none;color:var(--brand-ink);font-size:13px;font-weight:500;cursor:pointer}
.more-btn:hover{background:var(--hover)}
.item:focus-visible,.btn:focus-visible,.icon-btn:focus-visible,.seg button:focus-visible,.more-btn:focus-visible,.switch-btn:focus-visible,.linkbtn:focus-visible,.back-link:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

main{flex:1 1 auto;min-width:0;overflow-y:auto}
.page{max-width:1280px;padding:26px clamp(16px,3vw,40px) 56px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line2);min-height:52px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:15px;font-weight:600}
.card-b{padding:16px 18px}
.card-b.flush{padding:0}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 24px}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.f .k{font-size:12.5px;color:var(--muted);margin-bottom:3px}
.f .v{font-weight:500;overflow-wrap:anywhere}
.empty{color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);background:var(--thead);padding:10px 12px;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--hover)}
.side-list .row{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line2)}
.side-list .row:first-child{padding-top:0}.side-list .row:last-child{border-bottom:0;padding-bottom:0}
.side-list .k{font-size:12.5px;color:var(--muted)}
.side-list .v{font-weight:500}
.linkbtn{border:0;background:none;padding:0;color:var(--brand-ink);cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:2px;font-weight:500}
.linkbtn[disabled]{color:var(--muted);text-decoration:none;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;cursor:pointer;color:var(--text);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.destroy{background:#A61B1B;border-color:#A61B1B;color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.note-strip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:var(--brand-soft);color:var(--brand-ink);font-size:13.5px;line-height:1.45}
.stat-tiles{display:grid;gap:10px}
.tile{background:var(--thead);border-radius:8px;padding:14px;text-align:center}
.tile b{display:block;font-size:22px;font-weight:600}
.tile span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--thead);gap:2px;flex-wrap:wrap}
.seg button{min-height:34px;padding:0 14px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.step{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.step.done{color:var(--ok-text);border-color:var(--ok-bg);background:var(--ok-bg)}
.step.on{border-color:var(--text);color:var(--text);font-weight:600}
.form{display:grid;gap:14px;max-width:560px}
.form.wide{max-width:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.form label,.lab{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.form input:not([type=checkbox]):not([type=radio]),.form select,.form textarea{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.form input[readonly],.form select[disabled],.form textarea[readonly]{background:var(--thead);color:var(--muted)}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px}
.chk input{width:18px;height:18px}
.radios{display:flex;gap:16px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line2)}
.toggle input[role=switch]{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.toggle input[role=switch]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle input[role=switch]:checked{background:var(--brand)}
.toggle input[role=switch]:checked::after{transform:translateX(18px)}
.toggle input[role=switch]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ro-sec{margin-bottom:6px}
.timeline{display:flex;gap:16px;align-items:flex-start}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--muted);margin-top:16px}
.tl-card{flex:1;border-radius:8px;background:var(--warn-bg);color:var(--warn-text);padding:14px 16px}
.donut{width:180px;height:180px;border-radius:50%;background:conic-gradient(var(--brand) 0 100%);display:flex;align-items:center;justify-content:center;margin:8px auto}
.donut span{width:96px;height:96px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:600}
.big{font-size:30px;font-weight:600;letter-spacing:-.01em}
.money{display:grid;grid-template-columns:repeat(4,auto);gap:4px 24px;justify-content:end;text-align:right}
.money .k{font-size:12.5px;color:var(--muted)}.money .v{font-weight:600;font-size:16px}

.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.blade{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:100%;background:var(--surface);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .22s ease;z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.blade.on{transform:none}
.blade-h{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 22px;border-bottom:1px solid var(--line2);min-height:56px}
.blade-h h2{margin:0;font-size:16px;font-weight:600}
.blade-b{flex:1 1 auto;overflow-y:auto;padding:20px 22px}
.blade-f{display:flex;justify-content:space-between;gap:8px;padding:14px 22px;border-top:1px solid var(--line2)}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--text)}
.icon-btn:hover{background:var(--hover)}
.dialog-wrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:60;background:var(--scrim)}
.dialog-wrap.on{display:flex}
.dialog{width:440px;max-width:100%;background:var(--surface);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.dialog h2{margin:0;font-size:18px;font-weight:600}
.dialog p{margin:0;color:var(--muted);line-height:1.5}
.dialog .btns{justify-content:flex-end;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;background:var(--active-bg);color:var(--active-text);padding:12px 18px;border-radius:8px;box-shadow:var(--shadow);z-index:70;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){.grid-main{grid-template-columns:minmax(0,1fr)}.money{justify-content:start;text-align:left}}
@media (max-width:760px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.form.wide{grid-template-columns:minmax(0,1fr)}.money{grid-template-columns:repeat(2,auto)}}
@media (max-width:900px){
  .icon-btn.menu-toggle{display:flex}
  .search,.clock,.chg-toggle span{display:none}
  .side{position:fixed;top:0;left:0;bottom:0;z-index:45;width:310px;max-width:88vw;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .side.open{transform:none}
  .side-close{display:flex !important}
}
@media (max-width:520px){.fields,.fields.two{grid-template-columns:minmax(0,1fr)}.context{font-size:12px;padding:10px 16px}}
.lvl-sec{display:flex;flex-direction:column;gap:4px}
.lvl{display:flex;flex-direction:column;gap:2px;padding:4px 12px 10px}
.lvl-tag{align-self:flex-start;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--active-bg);color:var(--active-text);margin-bottom:4px}
.lvl-t{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.lvl-s{font-size:12.5px;color:var(--muted)}
.lvl-actions{margin-top:10px}
.pol-open .lvl-tag{background:var(--brand);color:#fff}
.item.pol-item.is-open{background:var(--brand-soft);color:var(--brand-ink);font-weight:600;border-radius:8px 8px 0 0}
.item.pol-item.is-open .r2{color:var(--brand-ink);opacity:.8}
.pol-open{border:1px solid var(--brand-soft);border-top:0;border-radius:0 0 10px 10px;padding:10px 4px 10px;margin-bottom:6px;background:var(--side)}
.pol-open .sub{padding-left:30px}
.bc{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.bc a.who{color:inherit;text-underline-offset:3px}
.bc-lvl{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.16)}
.bc-ref{opacity:.75}
.bc-sep{opacity:.6;font-size:16px;padding:0 2px}
.icon-ghost{position:relative;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text2);cursor:pointer}
.icon-ghost:hover{background:var(--hover);color:var(--text)}
.icon-ghost:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#B42318;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.quick{display:flex;gap:2px}
.vr{width:1px;height:28px;background:var(--line);margin:0 6px}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--active-bg);color:var(--active-text);font-size:12px;font-weight:500;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:5;pointer-events:none}
a.icon-ghost{text-decoration:none}
.chg{background:rgba(232,90,150,.09);color:inherit;border-radius:2px;padding:0 1px;text-decoration:underline;text-decoration-color:rgba(232,90,150,.45);text-decoration-thickness:1px;text-underline-offset:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* ================= Sidebar ================= */
function navItem(id,label,icon,cur,hr){return '<li><a class="item" href="'+hr+'"'+(id===cur?' aria-current="page"':'')+'>'+(icon?svg(icon,18):'')+'<span class="lbl">'+label+'</span></a></li>';}
function navList(items,cur,r){
 var html='<ul class="list">';
 items.forEach(function(n){
  if(!n.children){html+=navItem(n.id,n.label,n.icon,cur,href(r,n.id));return;}
  var has=n.children.some(function(c){return c.id===cur;});
  var key=r.scope+':'+n.group;if(has)S.open[key]=true;
  html+='<li><button type="button" class="item group-btn'+(has?' has-current':'')+'" aria-expanded="'+(!!S.open[key])+'" data-group="'+key+'">'+svg(n.icon,18)+'<span class="lbl">'+n.group+'</span><span class="chev">'+svg('chev',14)+'</span></button><ul class="sub">';
  n.children.forEach(function(c){html+=navItem(c.id,c.label,null,cur,href(r,c.id));});
  html+='</ul></li>';
 });
 return html+'</ul>';
}
function actionList(groups,defs,scope){

 groups.forEach(function(g){
  if(!g.sub)html+='<div class="rule" style="margin:10px 12px"></div>';
  else html+='<div class="act-sub">'+g.sub+'</div>';
  g.ids.forEach(function(id){var a=defs[id];

 });

/* ================= Flows (processes keep a stepper; navigation does not) ================= */
function stepper(names,cur){return '<div class="steps" aria-label="Progress">'+names.map(function(n,i){return '<span class="step'+(i<cur?' done':'')+(i===cur?' on':'')+'"'+(i===cur?' aria-current="step"':'')+'>'+(i+1)+'. '+n+'</span>';}).join('')+'</div>';}
function flowNav(cur,total,cancelHref,finishMsg){
 return '<div class="btns" style="margin-top:20px;justify-content:space-between"><div class="btns"><a class="btn" href="'+cancelHref+'">Cancel</a>'+(cur>0?'<button class="btn" type="button" data-step="'+(cur-1)+'">Back</button>':'')+'</div>'+(cur<total-1?'<button class="btn primary" type="button" data-step="'+(cur+1)+'">Next</button>':'<button class="btn primary" type="button" data-finish="'+cancelHref+'" data-msg="'+finishMsg+'">Save</button>')+'</div>';
}
function flowAmend(p){
 var names=['Client details','Consent screen','Contact and marketing'],c=Math.min(S.step,2),ret='#p/'+p.id+'/summary',body;
 if(c===0)body=card('Contact details',table(['Telephone number','Type'],[['00888888888',hl('Fax')],['00111222333',hl('Fax')]])+'<div class="btns" style="margin:12px 0 18px"><button class="btn sm" type="button" data-blade="addtel">Add telephone</button></div><div class="form">'+inF('ae','Email address',CLIENT.email,'email')+'</div>')+card('Stop renewal','<div class="form">'+yn('sr','Stop renewal',p.stopRenewal||'No')+'</div>');
 else if(c===1)body=renderSectionCards(detailSections(p)[2],false).replace(/<\/p>/g,'</p><div class="btns" style="margin-top:12px"><button class="btn sm" type="button" data-blade="consent">Add</button></div>');
 else body=renderSectionCards(detailSections(p)[6],true);
 return stepper(names,c)+'<div class="stack">'+body+'</div>'+flowNav(c,3,ret,'Details updated');
}
function flowAmendQuote(p){
 var secs=detailSections(p),c=Math.min(S.step,secs.length-1),ret='#p/'+p.id+'/summary';
 return stepper(secs.map(function(s){return s.title;}),c)+'<div class="stack">'+renderSectionCards(secs[c],c!==2&&c!==3)+'</div>'+flowNav(c,secs.length,ret,'Quote re-run');
}
function productSelection(){return card('Select a product','<div class="form">'+selF('pb','Brand',['Krypton'])+selF('pl','Business line',['Open Market Motor','Open Market Commercial Vehicle'])+selF('pa','Agent',['No Agent'])+'<div><button class="btn sm" type="button" data-blade="introducer">Add introducer</button></div></div>');}
function flowNewQuote(ret){return productSelection()+'<div class="btns" style="margin-top:20px;justify-content:space-between"><a class="btn" href="'+ret+'">Cancel</a><button class="btn primary" type="button" data-finish="#p/zz2966/quote" data-msg="New quote created">Next</button></div>';}
function flowNewClient(){
 var secs=detailSections(null,true),names=['Product selection'].concat(secs.map(function(s){return s.title;})),c=Math.min(S.step,names.length-1);
 var body=c===0?productSelection():renderSectionCards(secs[c-1],c-1!==2&&c-1!==3);
 return stepper(names,c)+'<div class="stack">'+body+'</div>'+flowNav(c,names.length,'#search','Client created and quote run');
}

function render(){
 R=parse();
 if(R.scope==='policy'&&allowedPolicyPages(R.p).indexOf(R.page)<0){location.replace('#p/'+R.p.id+'/summary');return;}
 if(R.scope==='client'&&!CLIENT_PAGES[R.page]){location.replace('#c/summary');return;}
 renderSide(R);renderContext(R);
 var t=(TITLES[R.scope]||{})[R.page]||['',''],body;
 if(R.scope==='app')body=APP_PAGES[R.page]();
 else if(R.scope==='client')body=CLIENT_PAGES[R.page]();
 else body=POLICY_PAGES[R.page](R.p);
 var crumb=R.scope==='policy'?(t[1]?t[1]:'Policy')+' · <span class="mono">'+esc(R.p.ref)+'</span>':(t[1]||'');
 document.getElementById('page').innerHTML=(crumb?'<div class="crumb">'+crumb+'</div>':'')+'<div class="ph"><h1>'+t[0]+'</h1>'+headActions()+'</div>'+body;
 document.title='Mobius · '+t[0].replace(/<[^>]+>/g,'').replace(/[“”]/g,'');
}
function go(){S.step=0;render();closeMenu();document.getElementById('sideScroll').scrollTop=0;var m=document.getElementById('main');m.scrollTop=0;if(S.scrollTo){var el=document.getElementById(S.scrollTo);S.scrollTo=null;if(el){m.scrollTop=el.getBoundingClientRect().top-m.getBoundingClientRect().top-16;var f=el.querySelector('button');if(f)f.focus({preventScroll:true});}}}

/* ================= Blade / dialog / toast mechanics ================= */
var bladeEl=document.getElementById('blade'),scrim=document.getElementById('scrim'),bladeKey=null,lastFocus=null;
function setPressed(){document.querySelectorAll('.act[aria-pressed]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-act')===bladeKey?'true':'false');});}
function openBlade(k,arg){var f=BLADES[k];if(!f)return;var b=f(R&&R.p,arg);lastFocus=document.activeElement;bladeKey=k;
 document.getElementById('bladeTitle').innerHTML=b[0];document.getElementById('bladeBody').innerHTML=b[1];
 var save=document.getElementById('bladeSave');save.style.display=b[2]?'':'none';save.textContent=b[3]||'Save';save.setAttribute('data-msg',b[2]||'');
 document.getElementById('bladeCancel').textContent=b[2]?'Cancel':'Close';
 bladeEl.classList.add('on');bladeEl.setAttribute('aria-hidden','false');scrim.classList.add('on');setPressed();closeMenu(true);
 setTimeout(function(){document.getElementById('bladeClose').focus();},60);}
function closeBlade(){if(!bladeKey)return;bladeEl.classList.remove('on');bladeEl.setAttribute('aria-hidden','true');if(!menuIsOpen())scrim.classList.remove('on');bladeKey=null;setPressed();if(lastFocus&&lastFocus.focus&&document.body.contains(lastFocus))lastFocus.focus();}
document.getElementById('bladeClose').onclick=closeBlade;document.getElementById('bladeCancel').onclick=closeBlade;
document.getElementById('bladeSave').onclick=function(){var m=this.getAttribute('data-msg');if(bladeKey==='cnotes'){var v=(document.getElementById('cn')||{}).value||'';if(!v.trim()){document.getElementById('cn').focus();return;}CLIENT_NOTES.unshift({by:'Laurence Abbott',at:'01/10/2026 15:26',text:v.trim()});}var wasNotes=bladeKey==='cnotes';closeBlade();if(m)toast(m);if(wasNotes)render();};
var dlg=document.getElementById('dlg'),dlgKey=null;
function openConfirm(k){var c=CONFIRMS[k];if(!c)return;dlgKey=k;lastFocus=document.activeElement;closeMenu(true);
 document.getElementById('dlgTitle').textContent=c[0];document.getElementById('dlgText').textContent=c[1];
 var ok=document.getElementById('dlgOk');ok.textContent=c[2];ok.className='btn '+(c[4]?'destroy':'primary');
 dlg.classList.add('on');document.getElementById('dlgCancel').focus();}
function closeConfirm(){dlg.classList.remove('on');dlgKey=null;if(!menuIsOpen()&&!bladeKey)scrim.classList.remove('on');if(lastFocus&&lastFocus.focus&&document.body.contains(lastFocus))lastFocus.focus();}
document.getElementById('dlgCancel').onclick=closeConfirm;
document.getElementById('dlgOk').onclick=function(){var m=CONFIRMS[dlgKey][3];closeConfirm();toast(m);};
var tEl=document.getElementById('toast'),tt;
function toast(m){tEl.textContent=m;tEl.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){tEl.classList.remove('on');},3000);}

/* ================= Mobile menu ================= */
var side=document.getElementById('side'),mo=document.getElementById('menuOpen');
function menuIsOpen(){return side.classList.contains('open');}
function openMenu(){side.classList.add('open');scrim.classList.add('on');mo.setAttribute('aria-expanded','true');}
function closeMenu(keep){if(!menuIsOpen())return;side.classList.remove('open');mo.setAttribute('aria-expanded','false');if(!keep&&!bladeKey)scrim.classList.remove('on');}
mo.onclick=openMenu;
scrim.onclick=function(){if(bladeKey)closeBlade();closeMenu();};

/* ================= Events ================= */
document.addEventListener('click',function(e){
 var t=e.target;
 if(t.closest('[data-close-menu]')){closeMenu();return;}
 var g=t.closest('[data-group]');if(g){var k=g.getAttribute('data-group');S.open[k]=g.getAttribute('aria-expanded')!=='true';g.setAttribute('aria-expanded',S.open[k]);return;}
 var sw=t.closest('[data-switch]');if(sw){S.switchOpen=!S.switchOpen;sw.setAttribute('aria-expanded',S.switchOpen);document.getElementById('polSwitch').hidden=!S.switchOpen;return;}
 var mr=t.closest('[data-more]');if(mr){S.polShown=mr.getAttribute('data-more')==='1'?Math.min(POLICIES.length,S.polShown+5):5;var y=document.getElementById('sideScroll').scrollTop;render();document.getElementById('sideScroll').scrollTop=y;return;}
 var a=t.closest('[data-act]');if(a){var id=a.getAttribute('data-act'),sc=a.getAttribute('data-scope');
  if(id==='support'){bladeKey==='support'?closeBlade():openBlade('support');return;}
  var def=(sc==='policy'?A:sc==='client'?CA:APPA)[id];if(!def)return;
  if(def.kind==='blade'){bladeKey===id?closeBlade():openBlade(id);}
  else if(def.kind==='confirm')openConfirm(id);
  else if(def.kind==='flow'){location.hash=sc==='policy'?'#p/'+R.p.id+'/'+def.to:(sc==='client'?'#c/newquote':'#'+def.to);}
  return;}
 var sg=t.closest('[data-seg]');if(sg){var nm=sg.getAttribute('data-seg'),v=sg.getAttribute('data-val');
  document.querySelectorAll('[data-seg="'+nm+'"]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-val')===v?'true':'false');});
  document.querySelectorAll('[data-panel="'+nm+'"]').forEach(function(pn){pn.hidden=pn.getAttribute('data-val')!==v;});return;}
 var st=t.closest('[data-step]');if(st){S.step=+st.getAttribute('data-step');render();document.getElementById('main').scrollTop=0;return;}
 var fin=t.closest('[data-finish]');if(fin){toast(fin.getAttribute('data-msg'));location.hash=fin.getAttribute('data-finish').replace(/^#/,'');return;}
 var bl=t.closest('[data-blade]');if(bl&&!bl.disabled){openBlade(bl.getAttribute('data-blade'),bl.getAttribute('data-arg'));return;}
 var cf=t.closest('[data-confirm]');if(cf&&!cf.disabled){openConfirm(cf.getAttribute('data-confirm'));return;}
 var ts=t.closest('[data-toast]');if(ts){toast(ts.getAttribute('data-toast'));return;}
 var sc=t.closest('[data-scrollto]');if(sc){S.scrollTo=sc.getAttribute('data-scrollto');}
 if(t.closest('a'))return;
 var hr=t.closest('[data-href]');if(hr){location.hash=hr.getAttribute('data-href').replace(/^#/,'');}
});
document.addEventListener('change',function(ev){var s=ev.target.closest&&ev.target.closest('[data-switch-toast]');if(s)toast(s.getAttribute('data-switch-toast')+(s.checked?' turned on':' turned off'));});
document.getElementById('chgToggle').addEventListener('change',function(){document.body.classList.toggle('hide-chg',!this.checked);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(dlgKey)closeConfirm();else if(bladeKey)closeBlade();else closeMenu();}});
window.addEventListener('hashchange',go);
go();
})();

</script>
</body>
</html>
