<!doctype html>
<html lang="en" data-bh-theme="buckholt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buckholt AI — Button validation</title>
  <link rel="stylesheet" href="../../css/buckholt.css">
</head>
<body>
  <main class="page-body">
    <div class="content-group">
      <div class="text-block">
        <h1 class="headline-03">Buckholt button validation</h1>
        <p>This page intentionally uses Buckholt classes only. Do not add visual override CSS during the first validation pass.</p>
      </div>

      <section class="content-group" aria-labelledby="default-buttons">
        <h2 id="default-buttons" class="headline-01">Default size</h2>
        <div class="button-set">
          <button type="button" class="btn btn-primary"><span class="button-label">Primary</span></button>
          <button type="button" class="btn btn-secondary"><span class="button-label">Secondary</span></button>
          <button type="button" class="btn btn-ghost"><span class="button-label">Ghost</span></button>
        </div>
      </section>

      <section class="content-group" aria-labelledby="small-buttons">
        <h2 id="small-buttons" class="headline-01">Small</h2>
        <div class="button-set">
          <button type="button" class="btn btn-primary btn-sm"><span class="button-label">Primary</span></button>
          <button type="button" class="btn btn-secondary btn-sm"><span class="button-label">Secondary</span></button>
          <button type="button" class="btn btn-ghost btn-sm"><span class="button-label">Ghost</span></button>
        </div>
      </section>

      <section class="content-group" aria-labelledby="large-buttons">
        <h2 id="large-buttons" class="headline-01">Large</h2>
        <div class="button-set">
          <button type="button" class="btn btn-primary btn-lg"><span class="button-label">Primary</span></button>
          <button type="button" class="btn btn-secondary btn-lg"><span class="button-label">Secondary</span></button>
          <button type="button" class="btn btn-ghost btn-lg"><span class="button-label">Ghost</span></button>
        </div>
      </section>

      <section class="content-group" aria-labelledby="disabled-buttons">
        <h2 id="disabled-buttons" class="headline-01">Disabled</h2>
        <div class="button-set">
          <button type="button" class="btn btn-primary" disabled><span class="button-label">Primary</span></button>
          <button type="button" class="btn btn-secondary" disabled><span class="button-label">Secondary</span></button>
          <button type="button" class="btn btn-ghost" disabled><span class="button-label">Ghost</span></button>
        </div>
      </section>

      <section class="content-group" aria-labelledby="stacked-buttons">
        <h2 id="stacked-buttons" class="headline-01">Stacked button set</h2>
        <div class="button-set button-set-stacked" style="max-width: 22rem;">
          <button type="button" class="btn btn-primary"><span class="button-label">Continue</span></button>
          <button type="button" class="btn btn-secondary"><span class="button-label">Back</span></button>
          <a class="link-standalone" href="#">Standalone link</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
