<!doctype html>
<html lang="en-GB" data-bs-theme="buckholt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applications | Configuration Hub</title>

<!-- Buckholt runtime contract. Order is fixed; no separate Bootstrap stylesheet. -->
<link rel="stylesheet" href="https://use.typekit.net/vtl2xbn.css">
<script src="https://kit.fontawesome.com/ca92816a31.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../../css/buckholt.css">
<link rel="stylesheet" href="../../css/buckholt-ai-fixes.css">
<!-- Prototype-only: the shared Configuration Hub shell. -->
<link rel="stylesheet" href="shell/ch-shell.css">
</head>
<body>

<!-- SH-00 · Home. The chrome (skip link, top bar, Test alert, breadcrumb band)
     is drawn into #ch-header and #ch-context by shell/ch-shell.js; this page
     owns only its landmarks and its content. Seed variants: ?seed=long-names,
     all-apps, test-only, staged-rollout, live-only (northgate is the default). -->
<div class="layout" data-layout="layout-03" data-layout-surface="flush">
  <header id="ch-header"></header>

  <main id="main">
    <div id="ch-context"></div>

    <section class="page-body">
      <div class="page-frame ch-home-frame">
        <div class="container-fluid">
          <div class="page-pane">
            <div class="page-panel">
              <h1 class="visually-hidden">Applications</h1>
              <div class="ch-app-grid" id="ch-app-grid"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="shell/ch-registry.js"></script>
<script src="shell/ch-shell.js"></script>
<script>
  (function () {
    'use strict';
    var esc = CHShell.esc;

    /* One Buckholt Card per visible app, in registry order: illustration
       (decorative), title as a level 2 heading, description, Primary Open.
       Open navigates, so it is a link styled as a Button; its accessible name
       starts with the visible label. Card internals are Buckholt's,
       including Card's documented `title-03` title. */
    function renderCards() {
      document.getElementById('ch-app-grid').innerHTML = CHShell.visibleApps().map(function (app) {
        return '<div class="card ch-app-card" data-app="' + esc(app.id) + '">' +
            '<img src="' + esc(CHShell.illustrationUrl(app)) + '" class="card-img" alt="">' +
            '<div class="card-body">' +
              '<div class="text-block">' +
                '<h2 class="title-03">' + esc(app.name) + '</h2>' +
                '<p>' + esc(app.description) + '</p>' +
              '</div>' +
              '<a class="btn btn-primary ch-open" href="' + esc(CHShell.appUrl(app)) + '" ' +
                 'aria-label="Open ' + esc(app.name) + '">' +
                '<span class="button-label">Open</span>' +
              '</a>' +
            '</div>' +
          '</div>';
      }).join('');
    }

    CHShell.init({
      page: 'Applications',
      breadcrumb: [{ label: 'Applications' }]
    });
    /* Gap 9: every card is the height of the tallest card on the page, not
       just the tallest in its row. Measured with the variable cleared, so a
       card set taller earlier can shrink again (a resize, the font arriving,
       a different card set after an environment switch). */
    function equaliseCards() {
      var grid = document.getElementById('ch-app-grid');
      grid.style.removeProperty('--ch-card-height');
      var tallest = 0;
      grid.querySelectorAll('.ch-app-card').forEach(function (card) {
        tallest = Math.max(tallest, card.getBoundingClientRect().height);
      });
      if (tallest) grid.style.setProperty('--ch-card-height', Math.ceil(tallest) + 'px');
    }

    function render() {
      renderCards();
      equaliseCards();
      document.querySelectorAll('#ch-app-grid img').forEach(function (img) {
        if (!img.complete) img.addEventListener('load', equaliseCards, { once: true });
      });
    }

    render();
    CHShell.onEnvironmentChange(render);
    var frame = null;
    window.addEventListener('resize', function () {
      if (frame) window.cancelAnimationFrame(frame);
      frame = window.requestAnimationFrame(equaliseCards);
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(equaliseCards);
  })();
</script>
</body>
</html>
