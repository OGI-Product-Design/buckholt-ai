<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobius client search — Buckholt exploration</title>

  <!-- Documented Buckholt runtime contract, in the documented order. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://use.typekit.net/vtl2xbn.css">
  <script src="https://kit.fontawesome.com/ca92816a31.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../css/buckholt.css">
  <link rel="stylesheet" href="../css/buckholt-ai-fixes.css">

  <!-- Exploration-only layout. Never styles a Buckholt component. -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="mx-body">

  <!--
    Application bar. Persistent context: who is being searched for, and once a
    client is chosen, which client is open. The broker should never have to
    wonder whether they are still on the right person.
  -->
  <header class="mx-appbar">
    <div class="mx-appbar-inner">
      <div class="mx-appbar-brand">
        <div class="icon-block icon-block-sm expressive-dark">
          <i class="fa-regular fa-shield-check" aria-hidden="true"></i>
        </div>
        <span class="label-01 mx-appbar-product">Mobius</span>
      </div>

      <div class="mx-appbar-search">
        <div class="input">
          <!-- The label row is real and correctly paired, but visually hidden:
               in an application bar the field is self-evident. `.visually-hidden`
               takes it out of flow, so Buckholt's 0.5rem `.input` gap does not
               push the field off the bar's centre line, and the label stays in
               the accessibility tree. -->
          <div class="input-label visually-hidden">
            <label for="mxSearch" class="form-label">Search clients</label>
          </div>
          <div class="response text-input">
            <i class="input-icon fa-regular fa-magnifying-glass" aria-hidden="true"></i>
            <input type="text" class="form-control" id="mxSearch" value="John Smith"
                   autocomplete="off">
            <button type="button" class="input-btn" id="mxSearchGo" aria-label="Search">
              <i class="fa-regular fa-arrow-right" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="mx-appbar-user">
        <span class="support-01 mx-appbar-meta">08 September 2026</span>
        <div class="avatar avatar-sm">
          <div class="avatar-initials">LA</div>
        </div>
      </div>
    </div>

    <!--
      Client context strip. Hidden during search; pinned once a client is open
      so identity stays visible while the broker works.
    -->
    <div class="mx-context" id="mxContext" hidden>
      <div class="mx-context-inner">
        <a class="link-standalone mx-context-back" href="#" id="mxBack">
          <span class="icon"><i class="fa-regular fa-arrow-left" aria-hidden="true"></i></span>
          Back to results
        </a>
        <div class="mx-context-identity" id="mxContextIdentity"></div>
      </div>
    </div>
  </header>

  <main>
    <section class="page-body">
      <div class="page-frame">
        <div class="container">

          <!-- ============================================================
               VIEW 1 — Search workspace. Master/detail, so choosing a
               candidate never costs the broker the list.
               ============================================================ -->
          <div class="page-pane" id="viewSearch">

            <div class="page-panel">
              <div class="text-block">
                <div class="heading">
                  <div class="heading-content">
                    <span class="eyebrow">Client search</span>
                    <h1 class="headline-02" id="mxResultHeading">John Smith</h1>
                  </div>
                  <!-- Standalone Link is one of Heading attachment's documented
                       attachments, and "New client" navigates to a form rather
                       than acting in place, so a link is the honest control. -->
                  <a class="link-standalone" href="#" target="_self" id="mxNewClient">
                    <span class="icon">
                      <i class="fa-regular fa-plus"></i>
                    </span>
                    New client
                  </a>
                </div>
                <p class="body-02" id="mxResultSummary"></p>
              </div>
            </div>

            <div class="page-panel">
              <div class="row mx-workspace">

                <!-- Master: the candidate list -->
                <div class="col-12 col-lg-6 mx-master" id="mxMaster">
                  <div class="mx-refine" id="mxRefine">
                    <div class="row input-row">
                      <div class="col-12 col-sm-6">
                        <div class="input">
                          <div class="input-label">
                            <label for="mxRefineText" class="form-label">Narrow by</label>
                            <small class="form-helper">Date of birth, postcode, policy or registration</small>
                          </div>
                          <div class="response text-input">
                            <input type="text" class="form-control" id="mxRefineText"
                                   placeholder="e.g. 1980, SO21, DE346GTRE" autocomplete="off">
                          </div>
                        </div>
                      </div>
                      <div class="col-12 col-sm-6">
                        <div class="input">
                          <div class="input-label">
                            <label for="mxRefineHolding" class="form-label">Holdings</label>
                          </div>
                          <div class="response select-input">
                            <select class="form-select" id="mxRefineHolding">
                              <option value="" selected>All records</option>
                              <option value="active">Has an active policy</option>
                              <option value="renewal">Renewal invited</option>
                              <option value="incomplete">Has incomplete work</option>
                              <option value="none">No policies held</option>
                            </select>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="mx-results" id="mxResults"></div>

                  <p class="support-01 mx-results-empty" id="mxResultsEmpty" hidden>
                    No records match. Try a different name, or clear the refinement.
                  </p>
                </div>

                <!-- Detail: the persistent preview of whoever is selected -->
                <div class="col-12 col-lg-6 mx-detail" id="mxDetail">
                  <div class="mx-detail-sticky" id="mxDetailInner"></div>
                </div>

              </div>
            </div>
          </div>

          <!-- ============================================================
               VIEW 2 — Client summary, anchored on what the client holds.
               ============================================================ -->
          <div class="page-pane" id="viewClient" hidden></div>

        </div>
      </div>
    </section>
  </main>

  <!-- Documented behaviour dependencies. jQuery must precede form.js. -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../components/form/form.js"></script>
  <script src="../components/dropdown/dropdown.js"></script>
  <script src="../components/tabs/tabs.js"></script>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
