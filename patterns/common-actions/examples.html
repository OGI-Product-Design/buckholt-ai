<!-- Common labelled action with recognised icon -->
<button type="button" class="btn btn-primary">
  <div class="btn-icon">
    <i class="fa-regular fa-plus" aria-hidden="true"></i>
  </div>
  <span class="button-label">Add</span>
</button>

<!-- Destructive common action -->
<button type="button" class="btn btn-ghost btn-danger">
  <div class="btn-icon">
    <i class="fa-regular fa-trash-can" aria-hidden="true"></i>
  </div>
  <span class="button-label">Delete</span>
</button>

<!-- Consistent labelled button set: all buttons use icons -->
<div class="button-set">
  <button type="button" class="btn btn-primary">
    <div class="btn-icon"><i class="fa-regular fa-floppy-disk" aria-hidden="true"></i></div>
    <span class="button-label">Save</span>
  </button>

  <button type="button" class="btn btn-secondary">
    <div class="btn-icon"><i class="fa-regular fa-pencil" aria-hidden="true"></i></div>
    <span class="button-label">Edit</span>
  </button>
</div>
