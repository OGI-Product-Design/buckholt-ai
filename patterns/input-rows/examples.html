<!-- Equal-width related inputs -->
<div class="row input-row">
  <div class="col">
    <div class="input">
      <div class="input-label">
        <label class="form-label" for="expiry">Expiry date</label>
      </div>
      <div class="response text-input">
        <input class="form-control" id="expiry" type="text">
      </div>
      <div class="invalid-feedback">Enter a valid expiry date</div>
    </div>
  </div>

  <div class="col">
    <div class="input">
      <div class="input-label">
        <label class="form-label" for="security-code">Security code</label>
      </div>
      <div class="response text-input">
        <input class="form-control" id="security-code" type="text">
      </div>
      <div class="invalid-feedback">Enter a valid security code</div>
    </div>
  </div>
</div>
