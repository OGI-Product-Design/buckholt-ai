<!-- Standard in-page form: stacked fields, actions at completion point. -->
<form class="form">
  <div class="form-body">
    <div class="input">
      <div class="input-label">
        <label class="form-label" for="first-name">First name</label>
      </div>
      <div class="response text-input">
        <input class="form-control" id="first-name" type="text">
      </div>
    </div>

    <div class="input">
      <div class="input-label">
        <label class="form-label" for="email">Email <small>(optional)</small></label>
      </div>
      <div class="response text-input">
        <input class="form-control" id="email" type="email">
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">
      <span class="button-label">Save details</span>
    </button>
    <button type="button" class="btn btn-ghost">
      <span class="button-label">Cancel</span>
    </button>
  </div>
</form>
