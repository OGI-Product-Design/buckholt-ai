<!-- Basic persistent Toast -->
<div class="toast toast-info fade show" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="false">
  <div class="toast-content">
    <span class="toast-icon"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></span>
    <div class="toast-body">
      <div class="toast-message"><h6>Toast message</h6></div>
      <div class="toast-note">Supporting detail.</div>
    </div>
  </div>
  <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
</div>

<!-- Success -->
<div class="toast toast-success fade show" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="false">
  <div class="toast-content">
    <span class="toast-icon"><i class="fa-solid fa-circle-check" aria-hidden="true"></i></span>
    <div class="toast-body">
      <div class="toast-message"><h6>Success toast message</h6></div>
    </div>
  </div>
</div>

<!-- Warning -->
<div class="toast toast-warning fade show" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="false">
  <div class="toast-content">
    <span class="toast-icon"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i></span>
    <div class="toast-body">
      <div class="toast-message"><h6>Warning toast message</h6></div>
    </div>
  </div>
</div>

<!-- Error -->
<div class="toast toast-error fade show" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="false">
  <div class="toast-content">
    <span class="toast-icon"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i></span>
    <div class="toast-body">
      <div class="toast-message"><h6>Error toast message</h6></div>
    </div>
  </div>
</div>
