<!-- Buckholt Alert canonical examples -->

<!-- Information Alert -->
<div class="alert alert-info" role="alert">
  <div class="alert-content">
    <span class="alert-icon">
      <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
    </span>
    <div class="alert-body">
      <div class="alert-message">
        <h6>Info alert message</h6>
      </div>
    </div>
  </div>
</div>

<!-- Success Alert -->
<div class="alert alert-success" role="alert">
  <div class="alert-content">
    <div class="alert-body">
      <div class="alert-message">
        <h6>Success alert message</h6>
      </div>
    </div>
  </div>
</div>

<!-- Warning Alert -->
<div class="alert alert-warning" role="alert">
  <div class="alert-content">
    <span class="alert-icon">
      <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
    </span>
    <div class="alert-body">
      <div class="alert-message">
        <h6>Warning alert message</h6>
      </div>
      <span class="alert-note">Supporting context or guidance.</span>
    </div>
  </div>
</div>

<!-- Error Alert -->
<div class="alert alert-error" role="alert">
  <div class="alert-content">
    <span class="alert-icon">
      <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
    </span>
    <div class="alert-body">
      <div class="alert-message">
        <h6>Error alert message</h6>
      </div>
    </div>
  </div>
</div>

<!-- Dismissible Alert -->
<div class="alert alert-info alert-dismissible fade show" role="alert">
  <div class="alert-content">
    <span class="alert-icon">
      <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
    </span>
    <div class="alert-body">
      <div class="alert-message">
        <h6>Alert message</h6>
      </div>
      <span class="alert-note">Optional supporting context.</span>
    </div>
  </div>
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<!-- Context bar belongs as the final element inside .alert-body.
     Reuse documented Buckholt Link and Button markup for its actions. -->
