<div class="input">
  <div class="input-label">
    <label class="form-label">Contact preference</label>
    <small class="form-helper">Choose one option</small>
  </div>
  <div class="response response-btn-input">
    <input type="radio" class="btn-check" name="contact-preference" id="contact-email" autocomplete="off">
    <label class="btn btn-response" for="contact-email">Email</label>
    <input type="radio" class="btn-check" name="contact-preference" id="contact-phone" autocomplete="off">
    <label class="btn btn-response" for="contact-phone">Phone</label>
  </div>
  <div class="invalid-feedback">Choose a contact preference</div>
</div>

<div class="input">
  <div class="response response-btn-input">
    <input type="radio" class="btn-check" name="large-response" id="large-response-1" autocomplete="off">
    <label class="btn btn-response btn-response-lg" for="large-response-1">
      <span class="icon"><i class="fa-regular fa-ghost" aria-hidden="true"></i></span>
      Response 1
    </label>
  </div>
</div>
