<!-- Buckholt Progress bar canonical examples -->

<!-- Determinate progress -->
<div class="progress-container">
  <div class="progress-header">
    <label for="progress-basic" class="progress-label">Uploading files</label>
    <span class="progress-note">50%</span>
  </div>

  <div id="progress-basic" class="progress" role="progressbar"
       aria-label="Uploading files"
       aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
    <div class="progress-bar" style="width: 50%"></div>
  </div>

  <small class="progress-helper">5 of 10 files uploaded</small>
</div>

<!-- Small progress -->
<div class="progress progress-sm" role="progressbar"
     aria-label="Compact progress"
     aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
  <div class="progress-bar" style="width: 50%"></div>
</div>

<!-- Indeterminate progress -->
<div class="progress-container">
  <div class="progress-header">
    <label for="progress-indeterminate" class="progress-label">Processing</label>
  </div>
  <div id="progress-indeterminate" class="progress" role="progressbar" aria-label="Processing">
    <div class="progress-bar progress-bar-indeterminate"></div>
  </div>
  <small class="progress-helper">This may take a moment.</small>
</div>

<!-- Success -->
<div class="progress-container">
  <div class="progress-header">
    <label for="progress-success" class="progress-label">Upload complete</label>
  </div>
  <div id="progress-success" class="progress is-valid" role="progressbar"
       aria-label="Upload complete"
       aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
    <div class="progress-bar"></div>
  </div>
</div>

<!-- Error -->
<div class="progress-container">
  <div class="progress-header">
    <label for="progress-error" class="progress-label">Upload failed</label>
  </div>
  <div id="progress-error" class="progress is-invalid" role="progressbar"
       aria-label="Upload failed"
       aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
    <div class="progress-bar"></div>
  </div>
  <div class="invalid-feedback">The upload could not be completed. Try again.</div>
</div>

<!-- Inactive -->
<div class="progress progress-inactive" role="progressbar" aria-label="Inactive process">
  <div class="progress-bar"></div>
</div>
