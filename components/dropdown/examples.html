<!-- Standard single-select Dropdown -->
<div class="input">
  <div class="input-label">
    <label for="dropdown-example" class="form-label">Dropdown label</label>
  </div>

  <div class="response dropdown-input">
    <div class="dropdown">
      <button id="dropdown-example"
              class="dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false">
        <span class="dropdown-label">Choose an option…</span>
      </button>

      <ul class="dropdown-menu dropdown-menu-panel"
          role="menu"
          aria-labelledby="dropdown-example">
        <li id="dropdown-example-option-1" class="dropdown-item" role="option" aria-label="Option 1" aria-selected="false" tabindex="0">Option 1</li>
        <li id="dropdown-example-option-2" class="dropdown-item" role="option" aria-label="Option 2" aria-selected="false" tabindex="0">Option 2</li>
        <li id="dropdown-example-option-3" class="dropdown-item" role="option" aria-label="Option 3" aria-selected="false" tabindex="0">Option 3</li>
      </ul>
    </div>
  </div>

  <div class="invalid-feedback">Validation message</div>
</div>

<!-- Supporting assistive and helper text -->
<div class="input">
  <div class="input-label">
    <label for="dropdown-helper" class="form-label">Dropdown helper text</label>
    <small class="form-helper">Assistive text</small>
  </div>

  <div class="response dropdown-input">
    <div class="dropdown">
      <button id="dropdown-helper" class="dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="dropdown-label">Choose an option…</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-panel" role="menu" aria-labelledby="dropdown-helper">
        <li class="dropdown-item" role="option" aria-selected="false" tabindex="0">Option 1</li>
        <li class="dropdown-item" role="option" aria-selected="false" tabindex="0">Option 2</li>
      </ul>
    </div>
  </div>

  <small class="form-helper">Helper text</small>
  <div class="invalid-feedback">Validation message</div>
</div>

<!-- Multiselect Dropdown with Select all -->
<div class="input">
  <div class="input-label">
    <label for="dropdown-permissions" class="form-label">Permissions</label>
  </div>

  <div class="response dropdown-input">
    <div class="dropdown">
      <button id="dropdown-permissions"
              class="dropdown-toggle"
              type="button"
              data-bs-toggle="dropdown"
              data-bs-auto-close="false"
              aria-expanded="false">
        <span class="dropdown-label">Choose options</span>
      </button>

      <ul class="dropdown-menu dropdown-menu-panel" role="menu" aria-labelledby="dropdown-permissions">
        <li id="dropdown-permissions-option-0" class="dropdown-item" role="option" aria-label="All permissions" aria-selected="false" tabindex="0">
          <input class="form-check-input" type="checkbox" value="" id="checkbox-all-permissions">
          <label class="form-check-label" for="checkbox-all-permissions">All permissions</label>
        </li>
        <li class="dropdown-divider"></li>
        <li id="dropdown-permissions-option-1" class="dropdown-item" role="option" aria-label="Option 1" aria-selected="false" tabindex="0">
          <input class="form-check-input" type="checkbox" value="" id="checkbox-permission-1">
          <label class="form-check-label" for="checkbox-permission-1">Option 1</label>
        </li>
        <li id="dropdown-permissions-option-2" class="dropdown-item" role="option" aria-label="Option 2" aria-selected="false" tabindex="0">
          <input class="form-check-input" type="checkbox" value="" id="checkbox-permission-2">
          <label class="form-check-label" for="checkbox-permission-2">Option 2</label>
        </li>
      </ul>
    </div>
  </div>

  <div class="invalid-feedback">Validation message</div>
</div>

<!-- Multiselect with collapsing selected Tags -->
<div class="input">
  <div class="input-label">
    <label for="dropdown-tags" class="form-label">Collapsible tags</label>
  </div>

  <div class="response dropdown-input">
    <div class="dropdown" data-collapse-threshold="2" data-summary-label="selected">
      <button id="dropdown-tags" class="dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="false" aria-expanded="false">
        <span class="dropdown-label">Choose options</span>
      </button>

      <ul class="dropdown-menu dropdown-menu-panel" role="menu" aria-labelledby="dropdown-tags">
        <li id="dropdown-tags-option-1" class="dropdown-item" role="option" aria-label="Option 1" aria-selected="false" tabindex="0">
          <input class="form-check-input" type="checkbox" value="" id="checkbox-tag-1">
          <label class="form-check-label" for="checkbox-tag-1">Option 1</label>
        </li>
        <li id="dropdown-tags-option-2" class="dropdown-item" role="option" aria-label="Option 2" aria-selected="false" tabindex="0">
          <input class="form-check-input" type="checkbox" value="" id="checkbox-tag-2">
          <label class="form-check-label" for="checkbox-tag-2">Option 2</label>
        </li>
        <li id="dropdown-tags-option-3" class="dropdown-item" role="option" aria-label="Option 3" aria-selected="false" tabindex="0">
          <input class="form-check-input" type="checkbox" value="" id="checkbox-tag-3">
          <label class="form-check-label" for="checkbox-tag-3">Option 3</label>
        </li>
      </ul>
    </div>
  </div>
</div>

<!-- Type-ahead Dropdown -->
<div class="input">
  <div class="input-label">
    <label for="dropdown-country" class="form-label">Assign to country</label>
  </div>

  <div class="response dropdown-input">
    <div class="dropdown">
      <input type="text"
             class="dropdown-toggle"
             id="dropdown-country"
             placeholder="Type to search"
             data-bs-toggle="dropdown"
             aria-expanded="false"
             value="">
      <button type="button" class="input-btn input-clear" aria-label="Clear"></button>

      <ul class="dropdown-menu dropdown-menu-panel" role="menu" aria-labelledby="dropdown-country">
        <li class="dropdown-item" role="option" aria-label="Australia" aria-selected="false" tabindex="0">Australia</li>
        <li class="dropdown-item" role="option" aria-label="Canada" aria-selected="false" tabindex="0">Canada</li>
        <li class="dropdown-item" role="option" aria-label="France" aria-selected="false" tabindex="0">France</li>
      </ul>
    </div>
  </div>
</div>

<!-- Required runtime scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="components/dropdown/dropdown.js"></script>
