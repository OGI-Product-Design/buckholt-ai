<!-- Buckholt Versa-tile canonical examples -->

<!-- Basic Versa-tile -->
<div class="versatile">
  <div class="versatile-content">
    <div class="versatile-body">
      <div class="icon-block">
        <i class="fa-regular fa-ghost" aria-hidden="true"></i>
      </div>

      <div class="versatile-meta">
        <div class="versatile-label">Versa-tile label</div>
        <p class="versatile-text">Supporting body text</p>
        <div class="key-value">
          <span class="key">Key</span>
          <span class="value">Value</span>
        </div>
      </div>
    </div>

    <div class="versatile-actions"></div>
  </div>
</div>

<!-- Versa-tile with item action -->
<div class="versatile">
  <div class="versatile-content">
    <div class="versatile-body">
      <div class="versatile-meta">
        <div class="versatile-label">Policy item</div>
        <div class="key-value">
          <span class="key">Reference</span>
          <span class="value">ABC123</span>
        </div>
      </div>
    </div>

    <div class="versatile-actions">
      <button type="button" class="btn btn-ghost">
        <span class="button-label">Edit</span>
      </button>
    </div>
  </div>
</div>

<!-- Versa-tile with multiple icon-only actions -->
<div class="versatile">
  <div class="versatile-content">
    <div class="versatile-body">
      <div class="versatile-meta">
        <div class="versatile-label">Policy item</div>
        <p class="versatile-text">Two contextual actions</p>
      </div>
    </div>

    <div class="versatile-actions">
      <div class="button-set">
        <button type="button" class="btn btn-ghost" aria-label="Edit">
          <span class="btn-icon"><i class="fa-regular fa-pen" aria-hidden="true"></i></span>
        </button>
        <button type="button" class="btn btn-ghost" aria-label="Delete">
          <span class="btn-icon"><i class="fa-regular fa-trash-can" aria-hidden="true"></i></span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Versa-tile with progress -->
<div class="versatile">
  <div class="versatile-content">
    <div class="versatile-body">
      <div class="versatile-meta">
        <div class="versatile-label">Processing item</div>
      </div>
    </div>
    <div class="versatile-actions"></div>
  </div>

  <div class="progress progress-sm" role="progressbar"
       aria-label="Versa-tile progress"
       aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
    <div class="progress-bar" style="width: 50%"></div>
  </div>
</div>

<!-- Whole-tile navigation -->
<a class="versatile" href="/destination">
  <div class="versatile-content">
    <div class="versatile-body">
      <div class="versatile-meta">
        <div class="versatile-label">Navigational item</div>
      </div>
    </div>
  </div>
</a>
