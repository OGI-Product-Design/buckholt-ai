<!-- Extracted verbatim from Buckholt Button: Code & specs. Do not alter canonical DOM structure. -->

<!-- Button base code -->
<button type="button" class="btn">
    <span class="button-label">Button label</span>    
</button>

<!-- Button variants -->
<button type="button" class="btn btn-primary">
    <span class="button-label">Primary</span>    
</button>

<button type="button" class="btn btn-secondary">
    <span class="button-label">Secondary</span>    
</button>

<button type="button" class="btn btn-ghost">
    <span class="button-label">Ghost</span>    
</button>

<!-- Danger button -->
<button type="button" class="btn btn-primary btn-danger">
    <span class="button-label">Primary</span>    
</button>

<button type="button" class="btn btn-secondary btn-danger">
    <span class="button-label">Secondary</span>    
</button>

<button type="button" class="btn btn-ghost btn-danger">
    <span class="button-label">Ghost</span>    
</button>

<!-- Size -->
<button type="button" class="btn btn-primary btn-sm">
    <span class="button-label">Small</span>    
</button>

<button type="button" class="btn btn-secondary btn-sm">
    <span class="button-label">Small</span>    
</button>

<button type="button" class="btn btn-ghost btn-sm">
    <span class="button-label">Small</span>    
</button>

<!-- Size -->
<button type="button" class="btn btn-primary btn-lg">
    <span class="button-label">Large</span>    
</button>

<button type="button" class="btn btn-secondary btn-lg">
    <span class="button-label">Large</span>    
</button>

<button type="button" class="btn btn-ghost btn-lg">
    <span class="button-label">Large</span>    
</button>

<!-- Icons in buttons -->
<button type="button" class="btn btn-primary">
    <div class="btn-icon">
        <i class="fa-regular fa-ghost"></i>
    </div>
    <span class="button-label">Button label</span>    
</button>

<!-- Icon-only buttons -->
<button type="button" class="btn btn-primary">
    <div class="btn-icon">
        <i class="fa-regular fa-ghost"></i>
    </div>       
</button>

<!-- Button sets -->
<div class="button-set">
    <button type="button" class="btn btn-primary">
        <span class="button-label">Accept all</span>    
    </button>
    <button type="button" class="btn btn-secondary">
        <span class="button-label">Customise</span>    
    </button>
    <button type="button" class="btn btn-ghost">
        <span class="button-label">Reject all</span>    
    </button>
</div>

<!-- Stacked buttons -->
<div class="button-set button-set-stacked">
    <button type="button" class="btn btn-primary">
        <span class="button-label">Accept all</span>    
    </button>
    <button type="button" class="btn btn-secondary">
        <span class="button-label">Customise</span>    
    </button>
    <button type="button" class="btn btn-ghost">
        <span class="button-label">Reject all</span>    
    </button>
</div>

<!-- Disabled -->
<button type="button" class="btn btn-primary" disabled>
    <span class="button-label">Primary</span>    
</button>

<button type="button" class="btn btn-secondary" disabled>
    <span class="button-label">Secondary</span>    
</button>

<button type="button" class="btn btn-ghost" disabled>
    <span class="button-label">Ghost</span>    
</button>
