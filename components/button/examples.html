<!--
  Buckholt Button examples

  These examples intentionally use only button classes and markup verified from
  the compiled runtime CSS and readable live documentation. Icon and danger
  examples are omitted until their canonical markup/modifier is verified from
  the live Code & specs page.
-->

<!-- Primary -->
<button type="button" class="btn btn-primary">Create document</button>

<!-- Secondary -->
<button type="button" class="btn btn-secondary">Add document</button>

<!-- Ghost -->
<button type="button" class="btn btn-ghost">Cancel</button>

<!-- Sizes -->
<button type="button" class="btn btn-primary btn-sm">Small action</button>
<button type="button" class="btn btn-primary">Medium action</button>
<button type="button" class="btn btn-primary btn-lg">Large action</button>

<!-- Disabled -->
<button type="button" class="btn btn-primary" disabled>Save changes</button>
<button type="button" class="btn btn-secondary" disabled>Add item</button>
<button type="button" class="btn btn-ghost" disabled>Cancel</button>

<!-- Related actions in a button set -->
<div class="button-set">
  <button type="button" class="btn btn-primary">Save changes</button>
  <button type="button" class="btn btn-secondary">Save draft</button>
  <button type="button" class="btn btn-ghost">Cancel</button>
</div>

<!-- Stacked/full-width button set -->
<div class="button-set button-set-stacked">
  <button type="button" class="btn btn-primary">Continue</button>
  <button type="button" class="btn btn-ghost">Cancel</button>
</div>
