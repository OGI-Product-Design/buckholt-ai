<!-- Number input: default -->
<div class="input">
  <div class="input-label">
    <label for="number-input-example" class="form-label">Example number input</label>
  </div>
  <div class="response num-input">
    <input type="number" class="form-control" id="number-input-example" value="0">
    <button type="button" class="input-btn step-btn step-add" aria-label="Increase value">
      <i class="fa-regular fa-plus" aria-hidden="true"></i>
    </button>
    <button type="button" class="input-btn step-btn step-minus" aria-label="Decrease value">
      <i class="fa-regular fa-minus" aria-hidden="true"></i>
    </button>
  </div>
</div>

<!-- Number input: assistive/helper text and validation -->
<div class="input">
  <div class="input-label">
    <label for="number-input-helper" class="form-label">Example number input</label>
    <small class="form-helper">Assistive text</small>
  </div>
  <div class="response num-input">
    <input type="number" class="form-control is-invalid" id="number-input-helper" value="0">
    <button type="button" class="input-btn step-btn step-add" aria-label="Increase value"><i class="fa-regular fa-plus" aria-hidden="true"></i></button>
    <button type="button" class="input-btn step-btn step-minus" aria-label="Decrease value"><i class="fa-regular fa-minus" aria-hidden="true"></i></button>
  </div>
  <small class="form-helper">Helper text</small>
  <div class="invalid-feedback">Validation message</div>
</div>

<!-- Number input: contextual icon -->
<div class="input">
  <div class="input-label">
    <label for="number-input-currency" class="form-label">Amount</label>
  </div>
  <div class="response num-input">
    <i class="input-icon fa-regular fa-sterling-sign" aria-hidden="true"></i>
    <input type="number" class="form-control" id="number-input-currency" value="0">
    <button type="button" class="input-btn step-btn step-add" aria-label="Increase value"><i class="fa-regular fa-plus" aria-hidden="true"></i></button>
    <button type="button" class="input-btn step-btn step-minus" aria-label="Decrease value"><i class="fa-regular fa-minus" aria-hidden="true"></i></button>
  </div>
</div>
