<!-- Default collapsed state -->
<div class="collapse-item">
  <a class="collapse-trigger"
     data-bs-toggle="collapse"
     href="#collapse-example"
     role="button"
     aria-expanded="false"
     aria-controls="collapse-example">
    Collapse trigger
  </a>

  <div class="collapse-card collapse" id="collapse-example">
    <div class="collapse-content">
      <div class="text-block">
        <h6 class="collapse-title">Collapse title</h6>
        <p>Suspendisse potenti. Vivamus non arcu tincidunt, congue massa at, porttitor velit.</p>
      </div>
    </div>

    <button type="button"
            class="btn-close"
            data-bs-toggle="collapse"
            href="#collapse-example"
            aria-label="Close"></button>
  </div>
</div>

<!-- Initially expanded state -->
<div class="collapse-item">
  <a class="collapse-trigger"
     data-bs-toggle="collapse"
     href="#collapse-expanded"
     role="button"
     aria-expanded="true"
     aria-controls="collapse-expanded">
    Collapse trigger
  </a>

  <div class="collapse-card collapse show" id="collapse-expanded">
    <div class="collapse-content">
      <div class="text-block">
        <h6 class="collapse-title">Collapse title</h6>
        <p>Additional content.</p>
      </div>
    </div>

    <button type="button"
            class="btn-close"
            data-bs-toggle="collapse"
            href="#collapse-expanded"
            aria-label="Close"></button>
  </div>
</div>
