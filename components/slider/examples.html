<!-- Code & specs example 1 -->
<div class="input">
    <div class="input-label">
        <label for="slider-example" class="form-label">Slider label text</label>
    </div>
    <div class="response slider-input">
        <div class="slider-container">
            <span class="minmax">0</span>
            <div class="slider-wrapper">
                <input type="range" class="form-slider" id="slider-example" min="0" max="100" step="1" value="50">
                <div class="ticks">
                    <span class="tick"></span>
                    <span class="tick"></span>
                    <span class="tick"></span>
                    <span class="tick"></span>
                    <span class="tick"></span>
                </div>
            </div>
            <span class="minmax">100</span>
            <input type="number" class="form-control" style="width: 4ch;" value="50" id="sliderOutput-example">
        </div>
    </div>
</div>
