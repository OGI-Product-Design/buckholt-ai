<!-- Single Checkbox -->
<div class="form-check">
  <input class="form-check-input" type="checkbox" value="" id="checkbox-example">
  <label class="form-check-label" for="checkbox-example">
    Checkbox label
  </label>
</div>

<!-- Checkbox group -->
<div class="input">
  <div class="input-label">
    <label for="checkInput-languages" class="form-label">Languages</label>
    <small class="form-helper">Assistive text</small>
  </div>

  <div class="response check-input">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="" id="checkbox-english">
      <label class="form-check-label" for="checkbox-english">English</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="" id="checkbox-french">
      <label class="form-check-label" for="checkbox-french">French</label>
    </div>
  </div>

  <small class="form-helper">This text might help you out</small>
  <div class="invalid-feedback">Validation message</div>
</div>

<!-- Documented visual state examples -->
<div class="form-check">
  <input class="form-check-input selected" type="checkbox" value="" id="checkbox-selected">
  <label class="form-check-label" for="checkbox-selected">Checkbox selected</label>
</div>

<div class="form-check">
  <input class="form-check-input indeterminate" type="checkbox" value="" id="checkbox-indeterminate">
  <label class="form-check-label" for="checkbox-indeterminate">Checkbox indeterminate</label>
</div>

<!-- Read-only visual treatment: requires JavaScript to block changes -->
<div class="form-check state_readonly">
  <input class="form-check-input" type="checkbox" value="" id="checkbox-readonly">
  <label class="form-check-label" for="checkbox-readonly">Checkbox read-only</label>
</div>
