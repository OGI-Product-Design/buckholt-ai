<!-- Basic Form -->
<form class="form" id="basicForm">
  <div class="text-block">
    <h2 class="headline-03">Contact details</h2>
    <p>Enter the details we need to contact you.</p>
  </div>

  <div class="form-body">
    <div class="input">
      <div class="input-label">
        <label for="fullName" class="form-label">Full name</label>
      </div>
      <div class="response text-input">
        <input type="text" class="form-control" id="fullName">
      </div>
      <div class="invalid-feedback">Enter your full name.</div>
    </div>
  </div>

  <!--
    Buckholt source currently conflicts here: rendered examples use .form-actions,
    while the explanatory documentation and compiled runtime use .form-buttons.
    Use .form-buttons for runtime-correct Buckholt spacing until upstream is resolved.
  -->
  <div class="form-buttons">
    <button type="submit" class="btn btn-primary btn-lg">
      <span class="button-label">Continue</span>
    </button>
    <a class="link-standalone" href="#">Cancel</a>
  </div>
</form>

<!-- Form with multiple body sections -->
<form class="form" id="multiSectionForm">
  <div class="text-block">
    <h2 class="headline-03">Account details</h2>
  </div>

  <div class="form-body">
    <div class="text-block">
      <h3 class="headline-01">Personal details</h3>
    </div>

    <div class="input">
      <div class="input-label">
        <label for="firstName" class="form-label">First name</label>
      </div>
      <div class="response text-input">
        <input type="text" class="form-control" id="firstName">
      </div>
      <div class="invalid-feedback">Enter your first name.</div>
    </div>
  </div>

  <div class="form-body">
    <div class="text-block">
      <h3 class="headline-01">Contact details</h3>
    </div>

    <div class="input">
      <div class="input-label">
        <label for="emailAddress" class="form-label">Email address</label>
      </div>
      <div class="response text-input">
        <input type="email" class="form-control" id="emailAddress">
      </div>
      <div class="invalid-feedback">Enter a valid email address.</div>
    </div>
  </div>

  <div class="form-buttons">
    <button type="submit" class="btn btn-primary btn-lg">
      <span class="button-label">Create account</span>
    </button>
    <a class="link-standalone" href="#">Cancel</a>
  </div>
</form>
