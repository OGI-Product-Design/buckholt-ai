<!-- Equal-width related inputs -->
<div class="row input-row">
  <div class="col">
    <div class="input">
      <div class="input-label">
        <label for="startDate" class="form-label">Start date</label>
      </div>
      <div class="response text-input">
        <input type="text" class="form-control" id="startDate">
      </div>
      <div class="invalid-feedback">Validation message</div>
    </div>
  </div>

  <div class="col">
    <div class="input">
      <div class="input-label">
        <label for="endDate" class="form-label">End date</label>
      </div>
      <div class="response text-input">
        <input type="text" class="form-control" id="endDate">
      </div>
      <div class="invalid-feedback">Validation message</div>
    </div>
  </div>
</div>

<!-- Documented unequal-width pattern, similar to expiry date + security code -->
<div class="row input-row">
  <div class="col">
    <div class="input">
      <div class="input-label">
        <label for="expiryDate" class="form-label">Expiry date</label>
      </div>
      <div class="response text-input">
        <input type="text" class="form-control" id="expiryDate" placeholder="mm / yy">
      </div>
      <div class="invalid-feedback">Validation message</div>
    </div>
  </div>

  <div class="col col-md-4">
    <div class="input">
      <div class="input-label">
        <label for="securityCode" class="form-label">Security code</label>
      </div>
      <div class="response text-input">
        <input type="text" class="form-control" id="securityCode" placeholder="000">
      </div>
      <div class="invalid-feedback">Validation message</div>
    </div>
  </div>
</div>
