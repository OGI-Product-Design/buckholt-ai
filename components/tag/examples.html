<!-- Read-only -->
<span class="tag">
  <span class="tag-label">Read-only tag</span>
</span>

<!-- Dismissible -->
<span class="tag tag-dismissible">
  <span class="tag-label">Dismissible tag</span>
  <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="tag" aria-label="Close"></button>
</span>

<!-- Single-select -->
<span class="tag tag-selectable" type="option" aria-selected="false">
  <input type="radio" name="single-tag" id="tag-single-select">
  <span class="tag-label">Single select</span>
</span>

<!-- Multi-select -->
<span class="tag tag-selectable" type="option" aria-selected="false">
  <input type="checkbox" id="tag-multi-select">
  <span class="tag-label">Multi select</span>
</span>

<!-- Status -->
<div class="tag-set">
  <span class="tag tag-status tag-status-info"><span class="tag-label">Info</span></span>
  <span class="tag tag-status tag-status-success"><span class="tag-label">Success</span></span>
  <span class="tag tag-status tag-status-warning"><span class="tag-label">Warning</span></span>
  <span class="tag tag-status tag-status-error"><span class="tag-label">Error</span></span>
</div>

<!-- Small: documented for read-only/status only -->
<span class="tag tag-sm"><span class="tag-label">Small</span></span>
<span class="tag tag-sm tag-status tag-status-info"><span class="tag-label">Small status</span></span>

<!-- Supporting icon -->
<span class="tag">
  <span class="icon"><i class="fa-solid fa-sparkles" aria-hidden="true"></i></span>
  <span class="tag-label">Tag with icon</span>
</span>

<!-- Expressive categorisation -->
<div class="tag-set">
  <span class="tag expressive-light"><span class="tag-label">Primary</span></span>
  <span class="tag expressive-light expressive-secondary"><span class="tag-label">Secondary</span></span>
  <span class="tag expressive-light expressive-tertiary"><span class="tag-label">Tertiary</span></span>
  <span class="tag expressive-light expressive-quaternary"><span class="tag-label">Quaternary</span></span>
</div>
