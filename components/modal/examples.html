<!-- Code & specs example 1 -->
<div class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div class="text-block">
                    <div class="heading">
                        <div class="heading-content">
                            <h3 class="headline-02">Modal heading</h3>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                </div>
            </div>
            <div class="modal-body">
                <div class="text-block">
                    <p>Modal body content goes here.</p>
                </div>
            </div>
            <div class="modal-footer">
                <div class="button-set">
                    <button type="button" class="btn btn-ghost"><span class="button-label">Button</span></button>
                    <button type="button" class="btn btn-primary"><span class="button-label">Button</span></button>
                </div>
            </div>
        </div>
    </div>
</div>
