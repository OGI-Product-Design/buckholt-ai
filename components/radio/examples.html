<!-- Radio group -->
<div class="input">
  <div class="input-label">
    <label class="form-label">Radio input label</label>
  </div>
  <div class="response check-input">
    <div class="form-check">
      <input class="form-check-input" type="radio" name="radioGroup" id="radio-example-1">
      <label class="form-check-label" for="radio-example-1">Radio #1</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="radioGroup" id="radio-example-2">
      <label class="form-check-label" for="radio-example-2">Radio #2</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="radioGroup" id="radio-example-3">
      <label class="form-check-label" for="radio-example-3">Radio #3</label>
    </div>
  </div>
</div>

<!-- Radio group with assistive/helper text -->
<div class="input">
  <div class="input-label">
    <label class="form-label">Radio input label</label>
    <small class="form-helper">Assistive text</small>
  </div>
  <div class="response check-input">
    <div class="form-check">
      <input class="form-check-input" type="radio" name="radioHelper" id="radio-helper-1">
      <label class="form-check-label" for="radio-helper-1">Radio #1</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="radioHelper" id="radio-helper-2">
      <label class="form-check-label" for="radio-helper-2">Radio #2</label>
    </div>
  </div>
  <small class="form-helper">Helper text</small>
  <div class="invalid-feedback">Validation message</div>
</div>

<!-- Disabled radio group -->
<div class="input disabled">
  <div class="input-label">
    <label class="form-label">Disabled radio group</label>
  </div>
  <div class="response check-input">
    <div class="form-check">
      <input class="form-check-input" type="radio" name="disabledGroup" id="radio-disabled-1" disabled>
      <label class="form-check-label" for="radio-disabled-1">Radio disabled #1</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="disabledGroup" id="radio-disabled-2" disabled checked>
      <label class="form-check-label" for="radio-disabled-2">Radio disabled #2</label>
    </div>
  </div>
</div>

<!-- Read-only radio: requires components/form/form.js to block state changes -->
<div class="form-check state_readonly">
  <input class="form-check-input" type="radio" name="readonlyGroup" id="radio-readonly" checked readonly>
  <label class="form-check-label" for="radio-readonly">Read-only selected</label>
</div>
